# Nixpacks configuration for Railway deployment
[phases.setup]
nixPkgs = ["php82", "php82Packages.composer", "nodejs_20", "npm"]

[phases.build]
cmds = [
    "composer install --no-dev --optimize-autoloader --no-interaction",
    "npm ci || npm install",
    "npm run build"
]

[start]
cmd = "bash start.sh"
